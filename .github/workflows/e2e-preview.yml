name: E2E — Preview
# Runs the Playwright suite against a deployed Vercel Preview (Sprint S2.3, decision D-23).
# This is the ONLY surface that holds the Protection Bypass secret and the fixture
# credentials — as GitHub Actions secrets, referenced by name. It is not a required
# status on `master`; the Code Check remains the only required check.
#
# Three ways in:
#   - pull_request — the PR's own check: waits for Vercel's Preview deployment of the
#     PR head, then tests that URL. Re-runs on every push.
#   - workflow_dispatch — manual, paste a Preview URL (GitHub offers the button only
#     once this file is on the default branch).
#   - deployment_status — automatic on a successful Preview deployment.
#
# Whatever the source, the URL must be https on this project's Vercel Preview hosts
# (unretire-*-86400-s-projects.vercel.app) — enforced here AND in playwright.config.ts —
# because the browser will carry the bypass secret and type fixture credentials there.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Deployed Preview URL to test (https://unretire-…-86400-s-projects.vercel.app)"
        required: true
        type: string
  deployment_status:
permissions:
  contents: read
  deployments: read
concurrency:
  group: e2e-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  e2e-preview:
    # PR and manual runs always; deployment_status runs only for a SUCCESSFUL Preview
    # deployment — never Production.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment_status.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the harness at the exact commit that was deployed.
          ref: ${{ github.event.pull_request.head.sha || github.event.deployment.sha || github.sha }}
      - name: Resolve the deployed Preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.preview_url }}
          EVENT_URL: ${{ github.event.deployment_status.environment_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=""
          if [ -n "$INPUT_URL" ]; then
            url="$INPUT_URL"
          elif [ -n "$EVENT_URL" ]; then
            url="$EVENT_URL"
          else
            # pull_request: wait (up to 10 min) for Vercel's GitHub deployment of the PR head.
            for attempt in $(seq 1 40); do
              id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$HEAD_SHA&per_page=20" \
                --jq '[.[] | select(.environment | startswith("Preview"))][0].id // empty')
              if [ -n "$id" ]; then
                state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" \
                  --jq '.[0].state // empty')
                case "$state" in
                  success)
                    url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=20" \
                      --jq '[.[] | select(.state == "success")][0].environment_url // empty')
                    ;;
                  failure | error)
                    echo "::error::Vercel reported the Preview deployment of $HEAD_SHA as $state"
                    exit 1
                    ;;
                esac
              fi
              [ -n "$url" ] && break
              echo "Preview deployment of $HEAD_SHA not ready yet (attempt $attempt/40)"
              sleep 15
            done
            if [ -z "$url" ]; then
              echo "::error::No successful Vercel Preview deployment found for $HEAD_SHA within 10 minutes"
              exit 1
            fi
          fi
          url="${url%/}"
          # Anchored allow-list: https, this project's Preview hosts only, no path.
          if ! [[ "$url" =~ ^https://unretire-[a-z0-9-]+-86400-s-projects\.vercel\.app$ ]]; then
            echo "::error::Refusing to test '$url' — not an https URL on this project's Vercel Preview hosts"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testing $url"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the e2e suite against the deployed Preview
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          # Skip Playwright's failure-time page snapshot (error-context.md): it would render
          # form field values. Belt and braces with the auth helper closing its page.
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
          E2E_SIGNED_IN_EMAIL: ${{ secrets.E2E_SIGNED_IN_EMAIL }}
          E2E_COURSE_EMAIL: ${{ secrets.E2E_COURSE_EMAIL }}
          E2E_PREMIUM_EMAIL: ${{ secrets.E2E_PREMIUM_EMAIL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
