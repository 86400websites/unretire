name: Morning Check
# The daily read-only check against PRODUCTION (docs/testing-setup/templates/MORNING-CHECK-TEMPLATE.md).
# Added disabled by Sprint S2.3 (2026-08-28); wired for launch by Sprint S5.2 (2026-09-03).
#
# Two locks, both owner-controlled from GitHub → Settings → Secrets and variables → Actions:
#   PRODUCTION_URL         variable — https://www.unretireproject.com, the ONLY value
#                          playwright.config.ts accepts for a morning run
#   MORNING_CHECK_ENABLED  variable — "true" turns the job on; anything else skips it
#
# What runs: exactly the owner-approved specs tagged `@morning` — anonymous, read-only,
# no signup, no purchase, no form submission, no e-mail. Prove the selection with
#   pnpm exec playwright test --grep "@morning" --list
# A selection that matches nothing FAILS the run: Playwright exits 1 on "No tests found".
#
# What this run must NOT carry: no VERCEL_AUTOMATION_BYPASS_SECRET (Production has no
# deployment protection, and the secret must never leave a Preview), no fixture password,
# no parity switch. playwright.config.ts refuses to start a morning run that finds any of
# them, and refuses every target but the production host. No Production test account
# exists — the approved set needs none — so the template's MORNING_TEST_* secrets are not
# referenced here; add them back only with an owner-approved signed-in check.
# Node pinned to 24 (pnpm 11.3.0 needs ≥ 22.13 — the S2.1 lesson).
on:
  schedule:
    - cron: "30 1 * * *" # daily 01:30 UTC = 07:00 IST — GitHub cron is UTC; adjust to taste
  workflow_dispatch: # a manual run any time from the Actions tab
permissions:
  contents: read
jobs:
  morning-check:
    if: vars.MORNING_CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the @morning tests against production
        run: pnpm exec playwright test --grep "@morning"
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          # The switch that admits the production host — and refuses every secret.
          E2E_MORNING: "1"
